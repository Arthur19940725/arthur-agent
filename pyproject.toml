[project]
name = "arthur-agent"
version = "0.2.0"
description = "A thread-scoped, auditable multi-agent research service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents>=0.4.3,<0.5",
    "fastapi>=0.141.1,<0.142",
    "langchain>=1.2,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "markdown>=3.10,<4",
    "mysql-connector-python>=9.6,<10",
    "pwdlib[argon2]>=0.3,<0.4",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.22,<1",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "starlette>=1.3.1,<2",
    "tavily-python>=0.7,<1",
    "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
documents = [
    "openpyxl>=3.1,<4",
    "pandas>=3,<4",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
]
pdf = [
    "weasyprint>=69,<70",
    "pywin32>=311; sys_platform == 'win32'",
]
ragflow = ["ragflow-sdk>=0.24,<0.26.1; python_version >= '3.12'"]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "httpx2>=2,<3",
    "pip-audit>=2.10,<3",
    "ruff>=0.15,<1",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["rawflow", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC", "UP"]

[tool.ruff.lint.per-file-ignores]
"api/server.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = [
    "agent/llm.py",
    "api/context.py",
    "api/task_service.py",
    "api/task_store.py",
    "api/workspace.py",
    "tools/outcomes.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[tool.coverage.run]
branch = true
source = ["agent", "api", "tools", "utils"]
